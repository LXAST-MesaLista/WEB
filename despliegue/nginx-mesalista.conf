# MesaLista · sitio de nginx (Ubuntu 24.04)
# instalar.sh sustituye __DOMAIN__, __APP_DIR__, __ACME_DIR__, __CERT__, __KEY__,
# __WEB_PORT__ y __API_PORT__ y lo copia en /etc/nginx/sites-available/mesalista.
#
# Un solo dominio para las dos partes que viven en esta máquina:
#   https://<dominio>/api/v1/   la API (mesalista-api.service, Node.js en 127.0.0.1:__API_PORT__)
#   https://<dominio>/          la web (mesalista-web.service, Node.js en 127.0.0.1:__WEB_PORT__)
# nginx termina HTTPS, sirve los archivos de /assets directamente y reenvía
# el resto a cada proceso de Node.js, que solo escuchan en 127.0.0.1.

upstream mesalista_web {
    server 127.0.0.1:__WEB_PORT__;
    keepalive 16;
}

upstream mesalista_api {
    server 127.0.0.1:__API_PORT__;
    keepalive 16;
}

# RS-11: el registro de accesos guarda la ruta sin la cadena de consulta
# ($uri en lugar de $request), así no quedan búsquedas por nombre o teléfono ni tokens.
log_format mesalista '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

# RS-10: el puerto 80 solo redirige a HTTPS, salvo el desafío HTTP de
# Let's Encrypt (/.well-known/acme-challenge/), que se sirve en claro.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    access_log /var/log/nginx/mesalista-access.log mesalista;
    error_log  /var/log/nginx/mesalista-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root __ACME_DIR__;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

server {
    # HTTP/2: varias peticiones por una sola conexión TLS (sintaxis de nginx 1.24, el de Ubuntu 24.04).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:mesalista:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/mesalista-access.log mesalista;
    error_log  /var/log/nginx/mesalista-error.log;

    # Compresión de texto (el HTML ya va comprimido por defecto).
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Un formulario de la web nunca pasa de unos pocos KB.
    client_max_body_size 1m;

    # Cabeceras comunes a todo el sitio. Ojo: nginx no hereda los add_header
    # en las location que tienen los suyos, por eso se repiten abajo.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # --- API ----------------------------------------------------------------
    # La API comprueba que la petición llegó por HTTPS con X-Forwarded-Proto y
    # toma la IP del cliente de X-Forwarded-For; solo se fía de ellas porque
    # la conexión llega desde 127.0.0.1 (trusted_proxies de la API). La
    # cabecera Authorization (el token Bearer) pasa tal cual.
    location /api/v1 {
        proxy_pass http://mesalista_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        # El cuerpo de una petición de la API nunca pasa de 16 KB.
        client_max_body_size 64k;

        # La API solo devuelve JSON: no carga nada ni se puede incrustar.
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # --- Web: archivos estáticos ---------------------------------------------
    # Bootstrap y las librerías llevan la versión en el nombre del archivo: el
    # navegador puede guardarlas un año. Los estilos y scripts propios, una
    # hora (las páginas los piden con ?v=fecha, así una versión nueva se usa ya).
    location ^~ /assets/ {
        root __APP_DIR__/publico;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        location ~ ^/assets/(bootstrap|vendor)/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    location = /favicon.ico {
        alias __APP_DIR__/publico/assets/icono.svg;
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Web: páginas ---------------------------------------------------------
    # Las páginas envían sus propias cabeceras de seguridad (CSP, no-store y la
    # cookie de sesión HttpOnly, Secure y SameSite=Lax).
    location / {
        proxy_pass http://mesalista_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
